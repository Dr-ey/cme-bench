[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cmebench"
version = "1.0.0"
description = "Reproducible benchmark for Competitive Mask Erosion (CME) vs saliency baselines"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["cmebench*"]
